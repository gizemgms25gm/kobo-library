<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kobo Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='kobo_project_style.css') }}">
</head>
<body>

    <header class="app-header">
        <div class="logo">
            Kobo <span>Library</span>
        </div>

        <div class="header-right">
            <button id="btn-sync" class="btn-sync" onclick="koboEsitle()" title="Kobo cihazından veritabanını ve EPUB kitapları çek">
                <svg class="sync-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                <span>Cihazı Eşitle</span>
            </button>

            <button id="btn-settings-open" class="btn-icon" onclick="ayarlariAc()" title="Bulut ve Senkronizasyon Ayarları">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Kitap veya yazar ara..." onkeyup="kitapFiltrele()">
            </div>

            <label class="ios-switch" title="Temayı Değiştir">
                <input type="checkbox" id="theme-toggle">
                <span class="slider round"></span>
            </label>
        </div>
    </header>

    <div id="toast-notification" class="toast-notification"></div>

    <!-- Ayarlar Modalı -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ Bulut & Yedekleme Ayarları</h3>
                <button class="btn-modal-close" onclick="ayarlariKapat()">✕</button>
            </div>
            
            <div class="modal-body">
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="setting-cloud-enabled" checked>
                        <span>Bulut Sürücüsüne EPUB & Veritabanı Yedekle</span>
                    </label>
                </div>

                <div class="form-group" id="cloud-provider-group">
                    <label class="form-label">Bulut Servisi Tercihi:</label>
                    <select id="setting-cloud-type" class="form-control" onchange="bulutTipiDegisti()">
                        <option value="otomatik">✨ Otomatik Algıla (Google Drive veya OneDrive)</option>
                        <option value="google_drive">📁 Google Drive</option>
                        <option value="onedrive">☁️ Microsoft OneDrive</option>
                        <option value="ozel">📂 Özel Klasör Yolu Belirt</option>
                    </select>
                </div>

                <div class="form-group" id="custom-path-group" style="display: none;">
                    <label class="form-label">Özel Klasör Yolu (Tam Yol):</label>
                    <input type="text" id="setting-custom-path" class="form-control" placeholder="Örn: D:\Yedeklerim\Kobo_Kitaplar">
                </div>

                <div class="current-cloud-path" id="detected-cloud-info">
                    <small>Aktif Bulut Yolu: <span id="detected-path-text">Taranıyor...</span></small>
                </div>

                <hr class="modal-ayrac">

                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="setting-github-enabled" checked>
                        <span>Eşitleme Sırasında GitHub'a Otomatik Push Et</span>
                    </label>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-secondary" onclick="ayarlariKapat()">Vazgeç</button>
                <button class="btn-primary" onclick="ayarlariKaydet()">Kaydet</button>
            </div>
        </div>
    </div>

    <main class="main-container">
        
        <div id="ana-kitaplik-view">
            <div id="kitap-listesi" class="grid-container">
                <!-- Kitap Kartları JS ile yüklenecek -->
            </div>
        </div>

        <div id="kitap-detay-view" style="display: none;" class="detay-container">
            <div class="detay-top-bar">
                <button id="btn-geri-don" class="btn-back">← Kitaplığa Dön</button>
                <a id="btn-download-epub" class="btn-epub-indir" style="display: none;" target="_blank" download>
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                    <span>EPUB İndir</span>
                </a>
            </div>
            
            <div class="detay-header">
                <h2 id="detay-kitap-adi">Kitap Adı</h2>
                <p id="detay-yazar-adi">Yazar Adı</p>
            </div>

            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filtreDegistir('all', this)">Tümü (<span id="count-all">0</span>)</button>
                <button class="filter-tab" data-filter="alinti" onclick="filtreDegistir('alinti', this)">💬 Alıntılar (<span id="count-alinti">0</span>)</button>
                <button class="filter-tab" data-filter="not" onclick="filtreDegistir('not', this)">📝 Notlar (<span id="count-not">0</span>)</button>
                <button class="filter-tab" data-filter="yer_imi" onclick="filtreDegistir('yer_imi', this)">🔖 Yer İmleri (<span id="count-yer_imi">0</span>)</button>
            </div>

            <hr class="detay-ayrac">

            <div id="alinti-not-listesi" class="alinti-listesi">
                <!-- Alıntı, Not ve Yer İmi içerikleri buraya yüklenecek -->
            </div>
        </div>

    </main>

    <script src="{{ url_for('static', filename='kobo_project_script.js') }}"></script>
</body>
</html>
